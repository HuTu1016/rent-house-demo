services:
  mysql:
    image: mysql:8.4
    container_name: rent-house-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rent_house}
      MYSQL_USER: ${MYSQL_USER:-rent_house}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rent_house_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    container_name: rent-house-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
volumes:
  mysql-data:
  redis-data:
