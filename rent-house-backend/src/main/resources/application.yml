spring:
  application:
    name: rent-house-backend
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: NOW()
      logic-not-delete-value: null
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
server:
  port: 8080
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
springdoc:
  api-docs:
    path: /v1/openapi
  swagger-ui:
    path: /swagger-ui.html
app:
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:./uploads}
  security:
    jwt-secret: ${APP_JWT_SECRET:cmVudC1ob3VzZS1kZW1vLWRldmVsb3BtZW50LXNlY3JldC0zMi1ieXRlcw==}
    access-token-minutes: 120
    refresh-token-days: 14
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
